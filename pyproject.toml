[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-codex"
version = "0.1.0"
description = "Local Linux voice-to-Codex CLI prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "python-dotenv>=1.0.0",
  "sounddevice>=0.4.6",
  "websockets>=12,<14",
]

[project.scripts]
voice-codex = "voice_codex.cli:main"
voice-codex-preflight = "voice_codex.cli:preflight_main"
voice-codex-once = "voice_codex.cli:once_main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["voice_codex*"]
